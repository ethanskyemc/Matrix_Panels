; Smart 16x16 Acrylic LED Matrix Display
; Supports ESP32-S3 (recommended), standard ESP32, and Native C++ test/simulator builds.

[platformio]
default_envs = esp32-s3-mcn32r16
data_dir = data

[common]
build_flags =
    -std=gnu++17
    -DMATRIX_WIDTH=16
    -DMATRIX_HEIGHT=16
    -DFW_VERSION=\"1.0.0\"
lib_deps =
    fastled/FastLED@3.7.8
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8
    links2004/WebSockets@^2.4.1
    adafruit/Adafruit BME680 Library@^2.0.4
    adafruit/Adafruit SHT4x Library@^1.0.4
    sensirion/Sensirion I2C SCD4x@^0.4.0

; ESP32-S3-WROOM-2-N32R16V: 32MB Octal Flash + 16MB Octal PSRAM
[env:esp32-s3-mcn32r16]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.filesystem = littlefs
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_build.psram_type = opi
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = default_32MB.csv
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DDEFAULT_LED_PIN=4
    -DDEFAULT_I2S_SCK_PIN=5
    -DDEFAULT_I2S_WS_PIN=6
    -DDEFAULT_I2S_SD_PIN=7
    -DDEFAULT_MMWAVE_RX_PIN=16
    -DDEFAULT_MMWAVE_TX_PIN=17
    -DDEFAULT_I2C_SDA_PIN=8
    -DDEFAULT_I2C_SCL_PIN=9
    -DDEFAULT_PIR_PIN=10
lib_deps = ${common.lib_deps}

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    ${common.build_flags}
    -DDEFAULT_LED_PIN=16
    -DDEFAULT_I2S_SCK_PIN=26
    -DDEFAULT_I2S_WS_PIN=25
    -DDEFAULT_I2S_SD_PIN=33
    -DDEFAULT_MMWAVE_RX_PIN=17
    -DDEFAULT_MMWAVE_TX_PIN=18
    -DDEFAULT_I2C_SDA_PIN=21
    -DDEFAULT_I2C_SCL_PIN=22
    -DDEFAULT_PIR_PIN=27
lib_deps = ${common.lib_deps}

[env:native]
platform = native
build_flags =
    -std=c++17
    -DMATRIX_NATIVE=1
    -DMATRIX_WIDTH=16
    -DMATRIX_HEIGHT=16
    -Iinclude
    -Isrc
build_src_filter =
    +<gfx/>
    +<core/>
    +<modes/>
    +<../sim/test_suite.cpp>
